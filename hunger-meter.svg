<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" width="100%" role="img" aria-label="Louis status bars: hunger 100%, listening 95%, good advice half a grain" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>text{font-family:"Fira Code","SFMono-Regular",Consolas,monospace;fill:#cfe6f7}.t{font-size:13px;fill:#5dade2}.l{font-size:14px;font-weight:700;letter-spacing:1px}.v{font-size:13px}.c{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}.e{font-size:22px}</style>
<rect x="1" y="1" width="818" height="208" rx="14" fill="#0d1b2a" stroke="#1b3a57" stroke-width="2"/>
<circle cx="24" cy="24" r="5" fill="#ff5f56"/><circle cx="42" cy="24" r="5" fill="#ffbd2e"/><circle cx="60" cy="24" r="5" fill="#27c93f"/>
<text class="t" x="82" y="29">louis_stats.exe</text>
<text class="l" x="30" y="77">HUNGER</text>
<rect x="190" y="62" width="330" height="18" rx="9" fill="#1b3a57"/>
<rect x="190" y="62" width="0" height="18" rx="9" fill="#ff9f43"><animate attributeName="width" values="0;330;330;0" keyTimes="0;0.25;0.9;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.55;1" dur="0.8s" begin="2s" repeatCount="indefinite"/></rect>
<text class="v" x="536" y="77">100% (always)</text>
<text class="l" x="30" y="115">LISTENING</text>
<rect x="190" y="100" width="330" height="18" rx="9" fill="#1b3a57"/>
<rect x="190" y="100" width="0" height="18" rx="9" fill="#5dade2"><animate attributeName="width" values="0;314;314;0" keyTimes="0;0.25;0.9;1" dur="7s" repeatCount="indefinite"/></rect>
<text class="v" x="536" y="115">95%</text>
<text class="l" x="30" y="153">GOOD ADVICE</text>
<rect x="190" y="138" width="330" height="18" rx="9" fill="#1b3a57"/>
<rect x="190" y="138" width="0" height="18" rx="9" fill="#e74c3c"><animate attributeName="width" values="0;20;20;0" keyTimes="0;0.25;0.9;1" dur="7s" repeatCount="indefinite"/></rect>
<text class="v" x="536" y="153">half a grain</text>
<text class="t" x="30" y="190">&gt; feed me<tspan class="c">_</tspan></text>
<text class="e" x="770" y="0">🍕<animateTransform attributeName="transform" type="translate" values="0,-10;0,240" dur="6s" begin="0s" repeatCount="indefinite"/></text>
<text class="e" x="740" y="0">🍜<animateTransform attributeName="transform" type="translate" values="0,-10;0,240" dur="8s" begin="2s" repeatCount="indefinite"/></text>
<text class="e" x="795" y="0">🍩<animateTransform attributeName="transform" type="translate" values="0,-10;0,240" dur="7s" begin="4s" repeatCount="indefinite"/></text>
</svg>